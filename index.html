<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mano's World — Phase I</title>
<style>
  :root{
    --void: #05070d;
    --deep-sea: #062033;
    --title: #eef4f8;
    --whisper: rgba(238,244,248,0.55);
    --gold: #d9b06c;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--void);
    overflow: hidden;
    font-family: 'Georgia', 'Iowan Old Style', serif;
  }
  #scene { position: fixed; inset: 0; display: block; cursor: grab; }
  #scene.dragging { cursor: grabbing; }

  .overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 8vh;
  }
  .title {
    color: var(--title);
    font-size: clamp(28px, 5vw, 48px);
    letter-spacing: 0.28em;
    font-weight: 400;
    text-transform: uppercase;
    opacity: 0;
    animation: riseIn 2.4s ease forwards 0.6s;
    text-align: center;
  }
  .subtitle {
    margin-top: 14px;
    color: var(--whisper);
    font-size: 13px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    opacity: 0;
    animation: riseIn 2.4s ease forwards 1.4s;
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hint {
    position: fixed;
    bottom: 6vh;
    left: 50%;
    transform: translateX(-50%);
    color: var(--whisper);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0;
    animation: hintIn 2s ease forwards 3s, hintOut 2s ease forwards 9s;
    pointer-events: none;
  }
  @keyframes hintIn { to { opacity: 1; } }
  @keyframes hintOut { to { opacity: 0; } }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="overlay">
  <div class="title">Mano's World</div>
  <div class="subtitle">Phase I &middot; The Planet</div>
</div>
<div class="hint">drag to rotate &nbsp;&middot;&nbsp; scroll to descend</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070d);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 500);

  // ---------- orbit state (custom, dependency-free) ----------
  const orbit = {
    radius: 16,
    minRadius: 6.4,
    maxRadius: 26,
    theta: Math.PI * 0.32,   // azimuth
    phi: Math.PI * 0.42,     // polar
    targetTheta: Math.PI * 0.32,
    targetPhi: Math.PI * 0.42,
    targetRadius: 16,
  };
  function updateCameraFromOrbit(){
    const sinPhi = Math.sin(orbit.phi);
    camera.position.set(
      orbit.radius * sinPhi * Math.cos(orbit.theta),
      orbit.radius * Math.cos(orbit.phi),
      orbit.radius * sinPhi * Math.sin(orbit.theta)
    );
    camera.lookAt(0,0,0);
  }
  updateCameraFromOrbit();

  let isDragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener('pointerdown', e => {
    isDragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add('dragging');
  });
  window.addEventListener('pointerup', () => { isDragging = false; canvas.classList.remove('dragging'); });
  window.addEventListener('pointermove', e => {
    if(!isDragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    orbit.targetTheta -= dx * 0.0045;
    orbit.targetPhi   -= dy * 0.0045;
    orbit.targetPhi = Math.max(0.18, Math.min(Math.PI - 0.18, orbit.targetPhi));
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    orbit.targetRadius += e.deltaY * 0.012;
    orbit.targetRadius = Math.max(orbit.minRadius, Math.min(orbit.maxRadius, orbit.targetRadius));
  }, { passive: false });

  // gentle touch support
  let pinchDist = null;
  canvas.addEventListener('touchstart', e => {
    if(e.touches.length === 1){ isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
    else if(e.touches.length === 2){ pinchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if(e.touches.length === 1 && isDragging){
      const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      orbit.targetTheta -= dx * 0.0045;
      orbit.targetPhi   -= dy * 0.0045;
      orbit.targetPhi = Math.max(0.18, Math.min(Math.PI - 0.18, orbit.targetPhi));
    } else if(e.touches.length === 2){
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      if(pinchDist){
        orbit.targetRadius += (pinchDist - d) * 0.02;
        orbit.targetRadius = Math.max(orbit.minRadius, Math.min(orbit.maxRadius, orbit.targetRadius));
      }
      pinchDist = d;
    }
  }, { passive: true });
  window.addEventListener('touchend', () => { isDragging = false; pinchDist = null; });

  // ---------- starfield ----------
  function buildStars(count, spread, size, color){
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    for(let i=0;i<count;i++){
      const r = spread * (0.6 + Math.random()*0.4);
      const u = Math.random(), v = Math.random();
      const theta = 2*Math.PI*u, phi = Math.acos(2*v-1);
      positions[i*3]   = r*Math.sin(phi)*Math.cos(theta);
      positions[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
      positions[i*3+2] = r*Math.cos(phi);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color, size, sizeAttenuation: true, transparent: true, opacity: 0.85 });
    return new THREE.Points(geo, mat);
  }
  scene.add(buildStars(2200, 140, 0.32, 0xdfe8f2));
  scene.add(buildStars(500, 90, 0.55, 0xbfd4ff));

  // ---------- planet ----------
  const PLANET_R = 5;
  const planetGroup = new THREE.Group();
  scene.add(planetGroup);

  const oceanGeo = new THREE.SphereGeometry(PLANET_R, 96, 96);
  const oceanMat = new THREE.MeshPhongMaterial({
    color: 0x0b3d5c,
    emissive: 0x03121d,
    specular: 0x6fa8c9,
    shininess: 38,
  });
  const ocean = new THREE.Mesh(oceanGeo, oceanMat);
  planetGroup.add(ocean);

  // soft atmosphere glow
  const atmoGeo = new THREE.SphereGeometry(PLANET_R * 1.045, 64, 64);
  const atmoMat = new THREE.MeshBasicMaterial({
    color: 0x4fa9e0, transparent: true, opacity: 0.14,
    side: THREE.BackSide,
  });
  planetGroup.add(new THREE.Mesh(atmoGeo, atmoMat));

  // outer rim glow (bigger, fainter)
  const rimGeo = new THREE.SphereGeometry(PLANET_R * 1.12, 48, 48);
  const rimMat = new THREE.MeshBasicMaterial({
    color: 0x2c6fa0, transparent: true, opacity: 0.06, side: THREE.BackSide,
  });
  planetGroup.add(new THREE.Mesh(rimGeo, rimMat));

  // ---------- lighting ----------
  scene.add(new THREE.AmbientLight(0x1a2a3a, 0.9));
  const sun = new THREE.DirectionalLight(0xfff2d8, 1.35);
  sun.position.set(12, 8, 6);
  scene.add(sun);
  const rimLight = new THREE.DirectionalLight(0x4a7fb5, 0.4);
  rimLight.position.set(-10, -4, -8);
  scene.add(rimLight);

  // ---------- island helpers ----------
  function latLonToVector3(lat, lon, radius){
    const phi = (90 - lat) * Math.PI/180;
    const theta = (lon + 180) * Math.PI/180;
    return new THREE.Vector3(
      -radius * Math.sin(phi) * Math.cos(theta),
       radius * Math.cos(phi),
       radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  function makeIslandGroup(lat, lon, opts){
    const pos = latLonToVector3(lat, lon, PLANET_R);
    const normal = pos.clone().normalize();
    const group = new THREE.Group();
    group.position.copy(pos);
    group.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), normal);

    const sandColor = 0xd9c08a;
    const grassColor = 0x4a8a4f;
    const forestColor = 0x2f6b3a;

    // sandy base (flattened, irregular via low-poly icosahedron squashed)
    const baseGeo = new THREE.IcosahedronGeometry(opts.size, 1);
    baseGeo.scale(1, 0.16, 1);
    jitter(baseGeo, opts.size * 0.12);
    const base = new THREE.Mesh(baseGeo, new THREE.MeshPhongMaterial({ color: sandColor, shininess: 4 }));
    base.position.y = opts.size * 0.05;
    group.add(base);

    // green interior
    const coreGeo = new THREE.IcosahedronGeometry(opts.size * 0.68, 1);
    coreGeo.scale(1, 0.22, 1);
    jitter(coreGeo, opts.size * 0.08);
    const core = new THREE.Mesh(coreGeo, new THREE.MeshPhongMaterial({ color: grassColor, shininess: 2 }));
    core.position.y = opts.size * 0.12;
    group.add(core);

    if(opts.forest){
      const treeCount = opts.mainIsland ? 14 : 6;
      for(let i=0;i<treeCount;i++){
        const a = Math.random()*Math.PI*2;
        const r = Math.random()*opts.size*0.5;
        const tx = Math.cos(a)*r, tz = Math.sin(a)*r;
        const th = opts.size * (0.22 + Math.random()*0.16);
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(th*0.05, th*0.07, th*0.35, 5),
          new THREE.MeshPhongMaterial({ color: 0x5b3d24 })
        );
        trunk.position.set(tx, opts.size*0.14 + th*0.17, tz);
        const foliage = new THREE.Mesh(
          new THREE.ConeGeometry(th*0.32, th*0.7, 6),
          new THREE.MeshPhongMaterial({ color: forestColor })
        );
        foliage.position.set(tx, opts.size*0.14 + th*0.55, tz);
        group.add(trunk, foliage);
      }
    }

    planetGroup.add(group);
    return group;
  }

  function jitter(geometry, amount){
    const pos = geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      pos.setX(i, pos.getX(i) + (Math.random()-0.5)*amount);
      pos.setZ(i, pos.getZ(i) + (Math.random()-0.5)*amount);
    }
    geometry.computeVertexNormals();
  }

  // one primary island, a few small ones — mostly ocean, as intended
  makeIslandGroup(8, 30, { size: 0.62, forest: true, mainIsland: true });
  makeIslandGroup(22, 55, { size: 0.16, forest: true });
  makeIslandGroup(-10, 10, { size: 0.12, forest: false });
  makeIslandGroup(3, -20, { size: 0.10, forest: true });
  makeIslandGroup(-25, 60, { size: 0.14, forest: false });

  // ---------- resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- animate ----------
  let idleRotation = 0;
  function animate(){
    requestAnimationFrame(animate);

    orbit.theta += (orbit.targetTheta - orbit.theta) * 0.08;
    orbit.phi   += (orbit.targetPhi   - orbit.phi)   * 0.08;
    orbit.radius+= (orbit.targetRadius- orbit.radius)* 0.08;
    updateCameraFromOrbit();

    if(!isDragging){
      idleRotation += 0.0009;
      planetGroup.rotation.y = idleRotation;
    } else {
      // keep manual rotation frozen relative to drag interactions on camera side
    }

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
